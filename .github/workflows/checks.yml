name: Checks

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect build inputs
        id: changes
        working-directory: ${{ github.workspace }}
        env:
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          code=true
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git diff --name-only --no-renames -z HEAD^1 HEAD > "$RUNNER_TEMP/changed-files"
            code=false
            while IFS= read -r -d '' path; do
              case "$path" in
                README.md|CHANGELOG.md|LICENSE|LICENSE.*|docs/*|.github/ISSUE_TEMPLATE/*) ;;
                *) code=true; break ;;
              esac
            done < "$RUNNER_TEMP/changed-files"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.code == 'true'
        with:
          node-version: 22
          cache: yarn

      - name: Enable Corepack
        if: steps.changes.outputs.code == 'true'
        run: corepack enable

      - name: Install dependencies
        if: steps.changes.outputs.code == 'true'
        run: yarn install --immutable

      - name: Lint
        if: steps.changes.outputs.code == 'true'
        run: yarn lint


      - name: Build
        if: steps.changes.outputs.code == 'true'
        run: yarn build

  # Yarn lockfiles lose dependency scopes in GitHub's static graph. Submit the
  # resolved graph so shared runtime/development packages retain runtime scope.
  dependency-scopes:
    name: Submit dependency scopes
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Submit resolved Yarn dependency graph
        uses: advanced-security/component-detection-dependency-submission-action@9b10cd206e0c4ee6ba213dbd3489e1a2e0e3a8e4
        with:
          detectorsFilter: Yarn
          fail-on-empty: 'true'
          correlator: yarn-dependency-scopes
